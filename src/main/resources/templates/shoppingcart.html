<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indkøbskurv</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

<header th:replace="~{fragments :: header}"></header>

<main class="page">
    <div class="modal modal-wide">
        <p class="eyebrow">Din bestilling</p>
        <h1>Din kurv</h1>

        <!-- Én række for hver cupcake i kurven. Det er her, Thymeleaf senere skal lave en løkke. -->
        <div class="cart-item" th:each="cupcake : ${cart}">
            <div class="thumb">CC</div>
            <div class="info">
                <h3 th:text="${cupcake.cupcakeBase.flavor + '-' + cupcake.cupcakeTopping.flavor}"></h3>
                <p class="product-desc" th:text="${cupcake.cupcakeBase.price + cupcake.cupcakeTopping.price + ',– pr. stk.'}"></p>
            </div>
            <div class="qty">
                <button type="button" class="qty-btn">−</button>
                <span th:text="${cupcake.quantity}"></span>
                <button type="button" class="qty-btn">+</button>
            </div>
        </div>


        <!-- Samlet pris -->
        <div class="summary-row" style="margin-top: 16px;">
            <span>Subtotal</span>
            <strong>148,–</strong>
        </div>
        <div class="summary-row">
            <span>Levering</span>
            <strong>Gratis</strong>
        </div>
        <div class="total-row">
            <span>I alt</span>
            <span>148,–</span>
        </div>

        <a href="payment.html" class="btn btn-full" style="margin-top: 24px;">Gå til checkout</a>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
