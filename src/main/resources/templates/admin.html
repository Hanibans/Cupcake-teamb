<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

<header th:replace="~{fragments :: header}"></header>

<main class="container">
    <p class="eyebrow">Kun for administratorer</p>
    <h1>Administration</h1>

    <!-- Ordreoversigt (US-5). Ingen mockup endnu, så den er simpel. -->
    <h2>Alle ordrer</h2>
    <div class="table-wrap">
        <table>
            <tr>
                <th>Ordrenr.</th>
                <th>Dato</th>
                <th>Status</th>
                <th>Betaling</th>
                <th>Kunde</th>
                <th>Pris</th>
                <th>Detaljer</th>
            </tr>
            <tr th:each="order : ${orders}">
                <td th:text="${'#' + order.orderId}"></td>
                <td th:text="${order.date}"></td>
                <td th:text="${order.orderStatus}"></td>
                <td th:text="${order.payment.paid ? 'Betalt' : 'Ubetalt'}"></td>
                <td th:text="${order.user.email}"></td>
                <td th:text="${order.totalPrice + ' kr.'}"></td>
                <td>
                    <a th:href="@{/admin/orders(orderId=${order.orderId})}">
                        Se ordre
                    </a>
                </td>
            </tr>
        </table>
    </div>

    <!-- Detaljer om valgt ordre (US-5) -->
    <div th:if="${selectedOrder != null}">

        <h2 th:text="${'Ordre #' + selectedOrder.orderId}"></h2>

        <table>
            <tr>
                <th>Cupcake Bund</th>
                <th>Cupcake Top</th>
                <th>Antal</th>
            </tr>

            <tr th:each="orderline : ${selectedOrder.orderlines}">
                <td th:text="${orderline.cupcakeBase.flavor}"></td>
                <td th:text="${orderline.cupcakeTopping.flavor}"></td>
                <td th:text="${orderline.quantity}"></td>
            </tr>
        </table>

    </div>

    <!-- Kundeoversigt (US-6) -->
    <h2>Kunder</h2>
    <div class="table-wrap">
        <table>
            <tr>
                <th>Navn</th>
                <th>E-mail</th>
            </tr>
            <tr>
                <td>Kari Hansen</td>
                <td>kunde@mail.dk</td>
            </tr>
        </table>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
