<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

<header th:replace="~{fragments :: header}"></header>

<main class="container">
    <p class="eyebrow">Kun for administratorer</p>
    <h1>Administration</h1>

    <!-- Ordreoversigt (US-5). Ingen mockup endnu, så den er simpel. -->
    <h2>Alle ordrer</h2>
    <div class="table-wrap">
        <table>
            <tr>
                <th>Ordrenr.</th>
                <th>Dato</th>
                <th>Status</th>
                <th>Betaling</th>
                <th>Kunde</th>
                <th>Pris</th>
                <th>Detaljer</th>
            </tr>
            <th:block th:each="order : ${orders}">
                <tr>
                    <td th:text="${'#' + order.orderId}"></td>
                    <td th:text="${#temporals.format(order.date, 'dd-MM-yyyy HH:mm')}"></td>
                    <td th:text="${order.orderStatus}"></td>
                    <td th:text="${order.payment.paid ? 'Betalt' : 'Ubetalt'}"></td>
                    <td th:text="${order.user.email}"></td>
                    <td th:text="${order.totalPrice + ' kr.'}"></td>
                    <td>
                        <a class="admin-order-link"
                           th:href="@{/admin/orders(orderId=${order.orderId})}">
                            Se ordre
                        </a>
                    </td>
                </tr>

                <tr th:if="${selectedOrder != null and selectedOrder.orderId == order.orderId}">
                    <td colspan="7">
                        <div class="admin-order-card">

                            <div class="admin-order-card-header">
                                <h3 th:text="${'Detaljer for ordre #' + selectedOrder.orderId}"></h3>
                            </div>

                            <table>
                                <tr>
                                    <th>Bund</th>
                                    <th>Top</th>
                                    <th>Antal</th>
                                </tr>

                                <tr th:each="orderline : ${selectedOrder.orderlines}">
                                    <td th:text="${orderline.cupcakeBase.flavor}"></td>
                                    <td th:text="${orderline.cupcakeTopping.flavor}"></td>
                                    <td th:text="${orderline.quantity}"></td>
                                </tr>
                            </table>

                        </div>
                    </td>
                </tr>
            </th:block>
        </table>
    </div>

    <!-- Kundeoversigt (US-6) -->
    <h2>Kunder</h2>
    <div class="table-wrap">
        <table>
            <tr>
                <th>Navn</th>
                <th>E-mail</th>
            </tr>
            <tr th:each="customer : ${customers}">
                <td th:text="${customer.name}"></td>
                <td th:text="${customer.email}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(customers)}">
                <td colspan="2">Ingen kunder endnu.</td>
            </tr>
        </table>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
