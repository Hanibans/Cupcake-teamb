<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

<header th:replace="~{fragments :: header}"></header>

<main class="container">
    <p class="eyebrow">Kun for administratorer</p>
    <h1>Administration</h1>

    <!-- Ordreoversigt (US-5). Ingen mockup endnu, så den er simpel. -->
    <h2>Alle ordrer</h2>
    <div class="table-wrap">
        <table>
            <tr>
                <th>Ordrenr.</th>
                <th>Dato</th>
                <th>Status</th>
                <th>Betaling</th>
                <th>Kunde</th>
                <th>Pris</th>
            </tr>
            <tr>
                <td>#1</td>
                <td>05-11-2026</td>
                <td>Afsendt</td>
                <td>Betalt</td>
                <td>kunde@mail.dk</td>
                <td>30 kr.</td>
            </tr>
        </table>
    </div>

    <!-- Kundeoversigt (US-6) -->
    <h2>Kunder</h2>
    <div class="table-wrap">
        <table>
            <tr>
                <th>Navn</th>
                <th>E-mail</th>
            </tr>
            <tr th:each="customer : ${customers}">
                <td th:text="${customer.name}">Kari Hansen</td>
                <td th:text="${customer.email}">kunde@mail.dk</td>
            </tr>
            <tr th:if="${#lists.isEmpty(customers)}">
                <td colspan="2">Ingen kunder endnu.</td>
            </tr>
        </table>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
