<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opret bruger</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

<header th:replace="~{fragments :: header}"></header>

<main class="page">
    <div class="modal">
        <p class="eyebrow">Velkommen</p>
        <h1>Opret bruger</h1>

        <div class="tabs">
            <a href="/login/checkout" class="tab">Log ind</a>
            <a href="/createuser/checkout" class="tab active">Opret bruger</a>
        </div>

        <form method="post" action="/createuser/checkout">
            <div class="field">
                <label for="navn">Navn</label>
                <input type="text" id="navn" name="name"
                       autocomplete="name" placeholder="Dit navn" required>
            </div>

            <div class="field">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email"
                       autocomplete="email" placeholder="dig@email.dk" required>
            </div>

            <div class="field">
                <label for="mobil">Mobilnummer</label>
                <input type="tel" id="mobil" name="phonenumber"
                       autocomplete="tel" placeholder="+45 12 34 56 78" required>
            </div>

            <div class="field">
                <label for="password">Adgangskode</label>
                <input type="password" id="password" name="password"
                       autocomplete="new-password" placeholder="Mindst 8 tegn"
                       minlength="8" required>
            </div>

            <button type="submit" class="btn btn-full">Opret bruger</button>
        </form>

        <p class="fine-print">
            Ved at fortsætte accepterer du vores handelsbetingelser og privatlivspolitik.
        </p>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
