<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Byg din egen cupcake</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

<header th:replace="~{fragments :: header}"></header>

<main>
    <!-- Billedet med tekst øverst på siden -->
    <section class="hero">
        <div class="hero-card">
            <p class="eyebrow">Håndpyntet i København</p>
            <h1>Små kager. <span>Store øjeblikke.</span></h1>
            <a href="#byg" class="hero-link">Lav din cupcake ↓</a>
        </div>
    </section>

    <!-- Her vælger kunden bund, topping og antal -->
    <section class="section" id="byg">
        <div class="center">
            <p class="eyebrow">Din kage, dine regler</p>
            <h2 class="big">Byg din egen <span>cupcake!</span></h2>
            <p class="intro" style="margin: 0 auto;">
                Mix din favoritbund med den helt rigtige topping. Vi bager og pynter den for dig.
            </p>
        </div>

        <form class="builder" action="/orderline/add" method="post">
            <div class="field">
                <label for="baseId">01 Bund</label>
                <select id="baseId" name="baseId">
                    <option th:each="base : ${bases}"
                            th:value="${base.cupcakeId}"
                            th:data-price="${base.price}"
                            th:text="${base.flavor + ' – ' + base.price + ' kr.'}">
                    </option>
                </select>
            </div>

            <div class="field">
                <label for="toppingId">02 Topping</label>
                <select id="toppingId" name="toppingId">
                    <option th:each="topping : ${toppings}"
                            th:value="${topping.cupcakeId}"
                            th:data-price="${topping.price}"
                            th:text="${topping.flavor + ' – ' + topping.price + ' kr.'}">
                    </option>
                </select>
            </div>

            <div class="field">
                <label for="quantity">03 Antal</label>
                <select id="quantity" name="quantity">
                    <option value="1">1 stk.</option>
                    <option value="2">2 stk.</option>
                    <option value="3">3 stk.</option>
                    <option value="4">4 stk.</option>
                    <option value="5">5 stk.</option>
                    <option value="6">6 stk.</option>
                    <option value="12">12 stk.</option>
                </select>
            </div>

            <div class="total-price">
                <p>Samlet pris: <strong id="totalPrice">0 kr.</strong></p>
            </div>

            <button type="submit" class="btn btn-blue">Tilføj til kurv</button>
        </form>
    </section>
</main>

<footer th:replace="~{fragments :: footer}"></footer>

<script>
    const baseSelect = document.getElementById("baseId");
    const toppingSelect = document.getElementById("toppingId");
    const quantitySelect = document.getElementById("quantity");
    const totalPrice = document.getElementById("totalPrice");

    function calculatePrice() {
        const basePrice = Number(
            baseSelect.selectedOptions[0]?.dataset.price || 0
        );

        const toppingPrice = Number(
            toppingSelect.selectedOptions[0]?.dataset.price || 0
        );

        const quantity = Number(quantitySelect.value);

        const total = (basePrice + toppingPrice) * quantity;

        totalPrice.textContent =
            total.toLocaleString("da-DK") + " kr.";
    }

    baseSelect.addEventListener("change", calculatePrice);
    toppingSelect.addEventListener("change", calculatePrice);
    quantitySelect.addEventListener("change", calculatePrice);

    calculatePrice();
</script>
</body>
</html>
