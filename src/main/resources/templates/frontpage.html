<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Byg din egen cupcake</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

<header th:replace="~{fragments :: header}"></header>

<main>
    <!-- Billedet med tekst øverst på siden -->
    <section class="hero">
        <div class="hero-card">
            <p class="eyebrow">Håndpyntet i København</p>
            <h1>Små kager. <span>Store øjeblikke.</span></h1>
            <a href="#byg" class="hero-link">Lav din cupcake ↓</a>
        </div>
    </section>

    <!-- Her vælger kunden bund, topping og antal -->
    <section class="section" id="byg">
        <div class="center">
            <p class="eyebrow">Din kage, dine regler</p>
            <h2 class="big">Byg din egen <span>cupcake!</span></h2>
            <p class="intro" style="margin: 0 auto;">
                Mix din favoritbund med den helt rigtige topping. Vi bager og pynter den for dig.
            </p>
        </div>

        <form class="builder">
            <div class="field">
                <label for="base">01 Bund</label>
                <select id="base" name="base">
                    <option>Vanilje</option>
                    <option>Chokolade</option>
                    <option>Gulerod</option>
                </select>
            </div>

            <div class="field">
                <label for="topping">02 Topping</label>
                <select id="topping" name="topping">
                    <option>Jordbærcreme</option>
                    <option>Smørcreme</option>
                    <option>Vaniljefrosting</option>
                    <option>Chokoladefrosting</option>
                </select>
            </div>

            <div class="field">
                <label for="antal">03 Antal</label>
                <select id="antal" name="antal">
                    <option>1 stk.</option>
                    <option>6 stk.</option>
                    <option>12 stk.</option>
                </select>
            </div>

            <button type="submit" class="btn btn-blue">Tilføj til kurv</button>
        </form>
    </section>
</main>

<footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
