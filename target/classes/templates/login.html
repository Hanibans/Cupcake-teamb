<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Gør siden tilpasset mobil. Skal altid med i <head>. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log ind</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- Topmenuen. Den er ens på alle sider. -->
<header th:replace="~{fragments :: header}"></header>

<main class="page">
    <div class="modal">
        <p class="eyebrow">Velkommen tilbage</p>
        <h1>Log ind</h1>

        <!-- Fanerne: den aktive er den side, vi er på. Den anden er et link til den anden side. -->
        <div class="tabs">
            <a href="login.html" class="tab active">Log ind</a>
            <a href="register.html" class="tab">Opret bruger</a>
        </div>

        <form method="post" action="/login">
        <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="dig@email.dk" required>
        </div>

        <div class="field">
            <label for="password">Adgangskode</label>
            <input type="password" id="password" name="password" placeholder="Mindst 8 tegn" required>
        </div>

        <button type="submit" class="btn btn-full">Log ind</button>
    </form>

        <p class="fine-print">
            Ved at fortsætte accepterer du vores handelsbetingelser og privatlivspolitik.
        </p>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
